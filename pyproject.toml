[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "help-tokens"
description = "Django app for linking to help pages with short tokens"
readme = "README.rst"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt", "AUTHORS"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Django",
    "edx",
]

dynamic = ["version"]

dependencies = [
    "Django",
]

[project.urls]
Homepage = "https://github.com/openedx/help-tokens"
Repository = "https://github.com/openedx/help-tokens"

[dependency-groups]
test-base = [
    "edx-django-release-util",
    "pytest-catchlog",
    "pytest-cov",
    "pytest-django",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "build",
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
    "twine",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["help_tokens", "help_tokens.*"]
exclude = ["*tests*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.uv]
package = true
default-groups = []
conflicts = [
    [{group = "test"}, {group = "django42"}],
    [{group = "quality"}, {group = "django42"}],
    [{group = "dev"}, {group = "django42"}],
]
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]

[tool.edx_lint]
uv_constraints = []

[tool.isort]
line_length = 120
known_edx = []
known_django = ["django"]
known_djangoapp = ["model_utils"]
known_first_party = ["help_tokens"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "DJANGOAPP", "EDX", "FIRSTPARTY", "LOCALFOLDER"]

[tool.coverage.run]
branch = true
data_file = ".coverage"
source = ["help_tokens"]
omit = [
    "test_settings",
    "*migrations*",
    "*admin.py",
    "*static*",
    "*templates*",
]
