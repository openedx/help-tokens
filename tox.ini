[tox]
requires = tox-uv>=1
envlist = py312-django{42, 52}, quality, check_keywords

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
ignore = D101,D200,D203,D212
match-dir = (?!migrations)

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov help_tokens --cov-report term-missing --cov-report xml
norecursedirs = .* requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands = 
    python -Wd -m pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
setenv = 
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = .
allowlist_externals = 
    make
    rm
    touch
commands = 
    touch tests/__init__.py
    pylint src/help_tokens tests
    rm tests/__init__.py
    pycodestyle src/help_tokens tests
    pydocstyle src/help_tokens tests
    python -m build --wheel
    twine check dist/*
    isort --check-only tests src/help_tokens manage.py test_settings.py
    make selfcheck

[testenv:check_keywords]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals =
    make
commands =
    make check_keywords
